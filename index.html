<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="WaDe Project — coming soon.">
  <title>WaDe Project</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #f3e4c8;
      --muted: #ccb287;
      --card: #111111;
      --border: rgba(212, 175, 55, 0.22);
      --shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 50% 22%, rgba(214,168,76,.13), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(214,168,76,.08), transparent 26%),
        var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Times, serif;
    }
    .page {
      min-height: 100svh;
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(22px, 4vw, 40px) 18px 26px;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      text-align: center;
      color: #f7e7c6;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: none;
      margin-bottom: 14px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .gallery {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: clamp(6px, 1vw, 12px);
      align-items: center;
    }
    .frame {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0a0a0a;
    }
    .frame.left { aspect-ratio: 3 / 4; align-self: center; }
    .frame.mid { aspect-ratio: 1 / 1; }
    .frame.right { aspect-ratio: 1 / 1; align-self: center; }
    h1 {
      margin: 2px 0 0;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: #f2d9a5;
      font-family: "Times New Roman", Times, serif;
    }
    .subtle {
      color: var(--muted);
      font-size: clamp(12px, 1.5vw, 16px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    @media (max-width: 850px) {
      .gallery { grid-template-columns: 1fr; max-width: 520px; }
      .frame.left, .frame.mid, .frame.right { aspect-ratio: auto; }
      .frame.left img { aspect-ratio: 3 / 4; }
      .frame.mid img, .frame.right img { aspect-ratio: 1 / 1; }
      main { gap: 16px; }
    }
  </style>
</head>
