<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="WaDe Project — coming soon.">
  <title>WaDe Project</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #f3e4c8;
      --muted: #ccb287;
      --border: rgba(212, 175, 55, 0.22);
      --shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 50% 22%, rgba(214,168,76,.13), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(214,168,76,.08), transparent 26%),
        var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Times, serif;
    }
    .page {
      min-height: 100svh;
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(22px, 4vw, 40px) 18px 26px;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      text-align: center;
      color: #f7e7c6;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: none;
      margin-bottom: 14px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .gallery {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2mm;
      align-items: center;
    }
    .frame {
      margin: 0;
      min-width: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      aspect-ratio: 1 / 1;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0a0a0a;
    }
    h1 {
      margin: 26px 0 0;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: #f2d9a5;
      font-family: "Times New Roman", Times, serif;
    }
    @media (max-width: 850px) {
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2mm; }
      .frame { aspect-ratio: 1 / 1; }
      main { gap: 14px; }
    }
  </style>
</head>
